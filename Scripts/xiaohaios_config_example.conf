# 哈士奇应用签到配置示例
# 将以下内容添加到你的 Surge 配置文件中

# ============================================
# 使用本地脚本文件
# ============================================
# 1. 将脚本文件保存到 iCloud Drive/Surge/ 目录
# 2. 修改下方路径为实际文件路径
# 3. 将以下配置添加到对应的段落中

[Script]
# Cookie抓取 - 访问小哈士奇网站时自动触发
哈士奇Cookie = type=http-request,pattern=^https:\/\/www\.xiaohaios\.com,requires-body=0,max-size=0,script-path=/path/to/xiaohaios_cookie.js

# 自动签到 - 每天9:00执行（可自定义时间）
哈士奇签到 = type=cron,cronexp="0 9 * * *",wake-system=1,timeout=60,script-path=/path/to/xiaohaios_checkin.js

[MITM]
hostname = %APPEND% www.xiaohaios.com

# ============================================
# 使用远程脚本（推荐）
# ============================================
# 如果脚本托管在 GitHub 等远程服务器，可以直接使用 URL

[Script]
哈士奇Cookie = type=http-request,pattern=^https:\/\/www\.xiaohaios\.com,requires-body=0,max-size=0,script-path=https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/Scripts/xiaohaios_cookie.js

哈士奇签到 = type=cron,cronexp="0 9 * * *",wake-system=1,timeout=60,script-path=https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/Scripts/xiaohaios_checkin.js

[MITM]
hostname = %APPEND% www.xiaohaios.com

# ============================================
# Cron 时间配置示例
# ============================================
# 每天 8:00: "0 8 * * *"
# 每天 9:30: "30 9 * * *"
# 每天 12:00: "0 12 * * *"
# 每天 22:00: "0 22 * * *"
# 每天 0:00: "0 0 * * *"

# ============================================
# 使用说明
# ============================================
# 1. 添加配置后重启 Surge
# 2. 在浏览器中访问 https://www.xiaohaios.com 并登录
# 3. 登录后会自动抓取 Cookie，收到通知即表示成功
# 4. 脚本会在每天设定时间自动签到
# 5. 可在 Surge 脚本管理中手动运行签到脚本
